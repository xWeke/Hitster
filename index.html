<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitster Bingo en casa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F7; --surface:#FFFFFF; --ink:#1F1A3D; --muted:#5E5980; --line:#D3D0E6;
  --accent:#D9365F; --accent-ink:#FFFFFF; --bad:#B93A34; --gold:#E9A82B;
  --vinyl:#1F1A3D; --groove:#36305F;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#151329; --surface:#211E3D; --ink:#F2EFFB; --muted:#A9A4C8; --line:#38335E;
    --accent:#FF5C87; --accent-ink:#1A0F1E; --bad:#FF746B; --gold:#F5BE4F;
    --vinyl:#0C0A1C; --groove:#2A2650;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 18px 130px}
h1{font-size:2.6rem;line-height:1;font-weight:800;letter-spacing:-.025em;margin:10px 0 6px}
h2{font-size:1.2rem;font-weight:700;margin:0 0 8px;line-height:1.3}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:.93rem}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
label{display:block;font-weight:600;font-size:.95rem;margin:10px 0}
input,select{font:inherit;font-weight:400;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 20px;font-weight:700;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;border:1.5px solid var(--line)}
.sm{padding:7px 14px;font-size:.9rem}
.wide{display:block;width:100%;margin:8px 0}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
code{word-break:break-all;background:var(--bg);padding:3px 7px;border-radius:6px;font-size:.85rem}
.msg{display:flex;gap:10px;align-items:flex-start;background:var(--bad);color:#fff;border-radius:14px;padding:12px 14px;margin:12px 0}
.open-sp{display:inline-block;margin-top:8px;padding:8px 16px;border-radius:999px;background:#fff;color:#1F1A3D;font-weight:700;text-decoration:none}
.qrcard{background:#fff;border-radius:22px;padding:18px;width:min(78vw,300px);margin:24px auto 12px;box-shadow:0 10px 30px rgba(20,15,50,.25)}
.qrcard img,.qrcard canvas{width:100%!important;height:auto!important;display:block}
.msg button{background:none;color:#fff;padding:0 4px;font-size:1.3rem;line-height:1}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
summary{cursor:pointer;font-weight:700}

.vinyl{display:grid;place-items:center;width:min(62vw,240px);aspect-ratio:1;margin:28px auto 12px;padding:0;border-radius:50%;
  background:radial-gradient(circle,var(--accent) 0 18%,var(--vinyl) 18.6% 20%,transparent 20.5%),
    repeating-radial-gradient(circle,var(--vinyl) 0 3px,var(--groove) 3px 4px);
  box-shadow:0 10px 30px rgba(20,15,50,.25)}
.vinyl .lbl{font-size:2rem;color:var(--accent-ink)}
.vinyl.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tl{list-style:none;margin:10px 0 0;padding:0}
.card{display:flex;gap:14px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:6px 0}
.card .y{font-weight:800;font-size:1.55rem;min-width:3.3ch;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card .t{line-height:1.25}
.card small{display:block;color:var(--muted);font-size:.88rem}
.years input{width:6em;margin:0;flex:none}

.dock{position:fixed;left:0;right:0;bottom:0;padding:24px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.dock button{display:block;width:100%;max-width:524px;margin:0 auto}

.hand{min-height:55vh;display:grid;place-content:center;text-align:center;gap:6px}
.hand .name{font-size:clamp(3rem,17vw,5.2rem);font-weight:800;line-height:1;letter-spacing:-.03em;margin:0 0 20px}

.year-big{font-size:clamp(5.5rem,32vw,9.5rem);font-weight:800;line-height:.9;letter-spacing:-.05em;text-align:center;color:var(--accent);margin:18px 0 6px;font-variant-numeric:tabular-nums;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.cover{width:112px;height:112px;object-fit:cover;border-radius:10px;display:block;margin:8px auto}
.song{text-align:center;line-height:1.3;font-size:1.15rem}
.song strong{font-size:1.6rem;letter-spacing:-.01em}

@media (prefers-reduced-motion:reduce){.vinyl.spin,.year-big{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch{ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} },
  del(k){ try{ localStorage.removeItem(k) }catch{} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let clientId = LS.get('hx-client', '');
let auth = LS.get('hx-auth', null);
let library = LS.get('hx-library', []);
let yearFix = LS.get('hx-years', {});
let settings = Object.assign({ offset:'30', sound:'qr' }, LS.get('hx-settings', {}));
let game = LS.get('hx-game', null);
if(game && game.mode !== 'bingo'){ game = null; LS.del('hx-game') }
let screen = 'setup', msg = '', busy = false, playing = false, noDevice = false;

const save = () => LS.set('hx-game', game);
const yearOf = t => yearFix[t.id] ?? t.year;

/* ---------- Spotify: inicio de sesión (PKCE) ---------- */
const SCOPES = 'user-modify-playback-state user-read-playback-state playlist-read-private playlist-read-collaborative';
const redirectUri = location.origin + location.pathname.replace(/index\.html$/, '');
const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

async function login(){
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  LS.set('hx-verifier', verifier);
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  const p = new URLSearchParams({ client_id:clientId, response_type:'code', redirect_uri:redirectUri,
    scope:SCOPES, code_challenge_method:'S256', code_challenge:b64url(new Uint8Array(digest)) });
  location.href = 'https://accounts.spotify.com/authorize?' + p;
}
async function tokenRequest(params){
  const r = await fetch('https://accounts.spotify.com/api/token', { method:'POST',
    headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
    body:new URLSearchParams({ client_id:clientId, ...params }) });
  const j = await r.json();
  if(!r.ok) throw new Error('Spotify no aceptó el inicio de sesión: ' + (j.error_description || j.error));
  auth = { access:j.access_token, refresh:j.refresh_token || auth?.refresh, exp:Date.now() + (j.expires_in - 60) * 1000 };
  LS.set('hx-auth', auth);
}
async function handleCallback(){
  const q = new URLSearchParams(location.search);
  if(!q.has('code') && !q.has('error')) return false;
  if(q.get('error')) msg = 'Spotify rechazó el inicio de sesión (' + q.get('error') + ').';
  else { try{ await tokenRequest({ grant_type:'authorization_code', code:q.get('code'), redirect_uri:redirectUri, code_verifier:LS.get('hx-verifier','') }) }catch(e){ msg = e.message } }
  history.replaceState(null, '', redirectUri);
  return true;
}
async function api(path, opts = {}, retry = true){
  if(!auth) throw new Error('Conecta tu cuenta de Spotify en el menú.');
  if(Date.now() > auth.exp) await tokenRequest({ grant_type:'refresh_token', refresh_token:auth.refresh });
  const url = path.startsWith('http') ? path : 'https://api.spotify.com/v1' + path;
  const r = await fetch(url, { ...opts, headers:{ Authorization:'Bearer ' + auth.access, 'Content-Type':'application/json' } });
  if(r.status === 401 && retry){ auth.exp = 0; return api(path, opts, false) }
  let j = null; try{ j = await r.json() }catch{}
  if(!r.ok){ const e = new Error(j?.error?.message || ('Spotify respondió con error ' + r.status)); e.status = r.status; e.reason = j?.error?.reason; throw e }
  return j;
}

/* ---------- Playlist ---------- */
async function fetchAll(first){
  const out = []; let next = first;
  while(next){ const j = await api(next); out.push(...j.items); next = j.next }
  return out;
}
async function loadPlaylist(input){
  const m = input.match(/playlist[\/:]([A-Za-z0-9]+)/);
  if(!m) throw new Error('No reconozco ese enlace. En Spotify, abre la playlist y usa Compartir y luego Copiar enlace.');
  let raw;
  try{ raw = await fetchAll('/playlists/' + m[1] + '/tracks?limit=100') }
  catch(e){ if([403,404,410].includes(e.status)) raw = await fetchAll('/playlists/' + m[1] + '/items?limit=100'); else throw e }
  const seen = new Set();
  library = raw.map(it => it.track || it.item)
    .filter(t => t && t.id && !t.is_local && t.type !== 'episode' && !seen.has(t.id) && seen.add(t.id))
    .map(t => ({ id:t.id, uri:t.uri, name:t.name, artists:(t.artists||[]).map(a => a.name).join(', '),
      year:parseInt((t.album?.release_date || '0').slice(0,4), 10), dur:t.duration_ms,
      img:(t.album?.images || []).slice(-2)[0]?.url || '' }));
  LS.set('hx-library', library);
  if(!library.length) throw new Error('La playlist no tiene canciones que se puedan usar.');
}

/* ---------- Reproducción ---------- */
async function playCurrent(){
  try{
    let dev = null;
    for(let i = 0; i < 3 && !dev; i++){
      if(i) await new Promise(r => setTimeout(r, 1500));
      const { devices } = await api('/me/player/devices');
      const list = devices.filter(d => !d.is_restricted);
      dev = list.find(d => d.is_active) || list.find(d => d.type === 'Smartphone') || list[0];
    }
    if(!dev){ noDevice = true; throw new Error('No encuentro Spotify. Ábrelo, pon cualquier canción y déjala sonando, vuelve aquí y toca el disco.') }
    noDevice = false;
    const t = game.track, pos = offsetFor(t);
    await api('/me/player/play?device_id=' + dev.id, { method:'PUT', body:JSON.stringify({ uris:[t.uri], position_ms:pos }) });
    playing = true;
  }catch(e){
    msg = e.reason === 'PREMIUM_REQUIRED' ? 'Spotify dice que esta cuenta no es Premium, y hace falta para poner las canciones desde aquí.' : e.message;
  }
  render();
}
function offsetFor(t){
  let pos = settings.offset === '30' ? 30000 : settings.offset === 'rand' ? 20000 + Math.floor(Math.random() * 40000) : 0;
  if(t.dur) pos = Math.max(0, Math.min(pos, t.dur - 30000));
  return pos;
}

/* Modo QR: cuando el otro móvil empieza a reproducir la canción, saltar al punto elegido */
let pollTimer = null, pollFor = null, seekState = '';
const seekTexts = {
  waiting:'Cuando empiece a sonar, la web la adelantará sola.',
  done:'Listo, la canción ya va por el punto elegido.',
  nopremium:'No se ha podido adelantar: hace falta que ese móvil use la misma cuenta Premium que esta web.',
  timeout:'No he detectado la canción sonando en tu cuenta, así que no se ha adelantado.'
};
function setSeek(st){ seekState = st; const h = $('#seekhint'); if(h) h.textContent = seekTexts[st] }
function stopPoll(){ clearInterval(pollTimer); pollTimer = null }
function startPoll(){
  stopPoll(); pollFor = game.track.id;
  if(settings.offset === '0' || !auth) return;
  const id = game.track.id, pos = offsetFor(game.track), started = Date.now();
  setSeek('waiting');
  pollTimer = setInterval(async () => {
    if(Date.now() - started > 120000){ stopPoll(); setSeek('timeout'); return }
    try{
      const p = await api('/me/player'), it = p?.item;
      if(it && (it.id === id || it.linked_from?.id === id) && p.is_playing){
        stopPoll();
        if(p.progress_ms < pos - 3000) await api('/me/player/seek?position_ms=' + pos, { method:'PUT' });
        setSeek('done');
      }
    }catch(e){ if(e.reason === 'PREMIUM_REQUIRED'){ stopPoll(); setSeek('nopremium') } }
  }, 2000);
}

function pause(){ if(playing){ playing = false; api('/me/player/pause', { method:'PUT' }).catch(() => {}) } }

/* ---------- Partida ---------- */
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }
function startGame(){
  const deck = shuffle(library.map(t => ({ ...t, year:yearOf(t) })));
  game = { mode:'bingo', deck, played:[], phase:'hidden' };
  game.track = deck.pop(); save(); screen = 'game';
}

/* ---------- Pantallas ---------- */
const alertBox = () => msg ? `<div class="msg" role="alert"><span>${esc(msg)}${noDevice ? '<br><a class="open-sp" href="spotify:">Abrir Spotify</a>' : ''}</span><button data-act="clearMsg" aria-label="Cerrar aviso">×</button></div>` : '';

function renderSetup(){
  const missing = [];
  if(!auth) missing.push('conectar Spotify');
  if(!library.length) missing.push('cargar una playlist');
  const opts = (vals, cur, lab) => vals.map(v => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${lab(v)}</option>`).join('');
  const ongoing = game && game.phase !== 'end';
  return `<main>
  <h1>Hitster Bingo en casa</h1>
  <p class="muted">Suena una canción al azar de la playlist y, cuando queráis, se revela la tarjeta con título, artista y año para marcar los cartones.</p>
  ${alertBox()}
  ${ongoing ? '<button class="btn wide" data-act="resume">Continuar la partida</button>' : ''}
  <section class="sec"><h2>1. Spotify</h2>${auth
    ? '<div class="row"><p style="margin:0;flex:1">Cuenta conectada.</p><button class="ghost sm" data-act="logout">Desconectar</button></div>'
    : `<p class="muted">Crea una app en developer.spotify.com/dashboard con la opción Web API y añade esta dirección de redirección exacta:</p>
       <p><code>${esc(redirectUri)}</code> <button class="ghost sm" data-act="copyUri">Copiar</button></p>
       <label>Client ID de la app<input id="cid" value="${esc(clientId)}" autocomplete="off" spellcheck="false"></label>
       <button class="btn" data-act="login">Conectar con Spotify</button>`}</section>
  <section class="sec"><h2>2. Canciones</h2>
    <label>Enlace de la playlist<input id="pl" placeholder="https://open.spotify.com/playlist/..." value="${esc(LS.get('hx-pl',''))}"></label>
    <div class="row"><button class="btn" data-act="loadPl" ${!auth || busy ? 'disabled' : ''}>${busy ? 'Cargando…' : library.length ? 'Volver a cargar' : 'Cargar playlist'}</button>
    ${library.length ? '<button class="ghost" data-act="years">Revisar años</button>' : ''}</div>
    ${library.length ? `<p class="muted" style="margin-top:10px">${library.length} canciones cargadas.</p>` : ''}</section>
  <section class="sec"><h2>3. Partida</h2>
    <label>Cómo suena la música<select data-set="sound">${opts(['qr','connect'], settings.sound, v => ({ qr:'Escaneando un QR con otro móvil', connect:'En el Spotify que esté abierto' })[v])}</select></label>
    <label>La canción empieza<select data-set="offset">${opts(['0','30','rand'], settings.offset, v => ({ '0':'Desde el principio', '30':'A los 30 segundos', rand:'En un punto al azar' })[v])}</select></label>
    ${settings.sound === 'qr' ? `<p class="muted">Esta pantalla muestra un QR por canción. Quien lo escanee abre la canción en su Spotify; ese móvil hace de altavoz y su pantalla no la debe ver nadie más.${settings.offset !== '0' ? ' Para que la canción se adelante sola, ese móvil tiene que tener abierta la misma cuenta Premium que esta web.' : ''}</p>` : ''}
    ${missing.length ? `<p class="muted">Para empezar falta: ${missing.join(' y ')}.</p>` : ''}</section>
  <div class="dock"><button class="btn" data-act="start" ${missing.length ? 'disabled' : ''}>${ongoing ? 'Empezar una partida nueva' : 'Empezar partida'}</button></div>
  </main>`;
}

function renderYears(){
  const list = [...library].sort((a, b) => yearOf(a) - yearOf(b));
  return `<main><h1>Revisar años</h1>
  <p class="muted">Spotify a veces da el año de un remaster o un recopilatorio en vez del original. Corrige los que no cuadren; se guardan en este navegador.</p>
  <button class="btn" data-act="toSetup">Listo</button>
  <ul class="tl years">${list.map(t => `<li class="card"><input type="number" inputmode="numeric" min="1900" max="2100" value="${yearOf(t)}" data-yid="${t.id}" aria-label="Año de ${esc(t.name)}"><span class="t">${esc(t.name)}<small>${esc(t.artists)}</small></span></li>`).join('')}</ul></main>`;
}

function renderGame(){
  const g = game, t = g.track, total = g.played.length + g.deck.length + (t ? 1 : 0);
  const history = g.played.length ? `<details class="sec"><summary>Ya han sonado (${g.played.length})</summary><ol class="tl">${g.played.map(c => `<li class="card"><span class="y">${c.year}</span><span class="t">${esc(c.name)}<small>${esc(c.artists)}</small></span></li>`).join('')}</ol></details>` : '';
  if(g.phase === 'end') return `<main><div class="hand"><p class="muted">Se acabó la playlist</p><p class="name">Fin</p></div>${history}
    <div class="dock"><button class="btn" data-act="newGame">Nueva partida</button></div></main>`;
  const head = `<div class="top"><button class="ghost sm" data-act="toSetup">Menú</button><span class="muted">Canción ${g.played.length + 1} de ${total}</span></div>${alertBox()}`;
  if(g.phase === 'hidden' && settings.sound === 'qr') return `<main>${head}
    <div class="qrcard" id="qr" role="img" aria-label="Código QR de la canción"></div>
    <p class="muted" style="text-align:center">Escanéalo con el otro móvil para que suene.</p>
    ${settings.offset !== '0' ? `<p class="muted" id="seekhint" style="text-align:center">${seekTexts[seekState] || ''}</p>` : ''}${history}
    <div class="dock"><button class="btn" data-act="reveal">Revelar tarjeta</button></div></main>`;
  if(g.phase === 'hidden') return `<main>${head}
    <button class="vinyl${playing ? ' spin' : ''}" data-act="play" aria-label="${playing ? 'Volver a poner la canción' : 'Poner la canción'}"><span class="lbl">${playing ? '♪' : '▶'}</span></button>
    <p class="muted" style="text-align:center">${playing ? 'Toca el disco si hace falta volver a ponerla.' : 'Toca el disco para poner la canción.'}</p>${history}
    <div class="dock"><button class="btn" data-act="reveal">Revelar tarjeta</button></div></main>`;
  return `<main>${head}<p class="year-big">${t.year}</p>
    ${t.img ? `<img class="cover" src="${esc(t.img)}" alt="">` : ''}
    <p class="song"><strong>${esc(t.name)}</strong><br>${esc(t.artists)}</p>${history}
    <div class="dock"><button class="btn" data-act="next">${g.deck.length ? 'Siguiente canción' : 'Terminar'}</button></div></main>`;
}

function render(){
  app.innerHTML = screen === 'years' ? renderYears() : screen === 'game' && game ? renderGame() : renderSetup();
  const box = $('#qr');
  if(box && game?.track){ if(pollFor !== game.track.id) startPoll() }
  else { stopPoll(); pollFor = null }
  if(box && game?.track){
    if(window.QRCode) new QRCode(box, { text:'https://open.spotify.com/track/' + game.track.id, width:512, height:512, colorDark:'#000000', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
    else box.outerHTML = '<p class="msg">No se ha podido cargar el generador de QR. Comprueba la conexión y recarga la página.</p>';
  }
}

/* ---------- Acciones ---------- */
const actions = {
  clearMsg(){},
  copyUri(_, b){ navigator.clipboard?.writeText(redirectUri).then(() => { b.textContent = 'Copiada' }); return false },
  async login(){
    clientId = ($('#cid')?.value || '').trim();
    if(!clientId){ msg = 'Pega el Client ID de tu app de Spotify.'; return }
    LS.set('hx-client', clientId); await login(); return false;
  },
  logout(){ auth = null; LS.del('hx-auth') },
  async loadPl(){
    const v = ($('#pl')?.value || '').trim(); LS.set('hx-pl', v);
    busy = true; render();
    try{ await loadPlaylist(v) }catch(e){ msg = e.message }
    busy = false;
  },
  years(){ screen = 'years' },
  start(){ startGame(); render(); if(settings.sound !== 'qr') playCurrent(); return false },
  resume(){ screen = 'game' },
  toSetup(){ pause(); screen = 'setup' },
  newGame(){ game = null; LS.del('hx-game'); screen = 'setup' },
  play(){ playCurrent(); return false },
  reveal(){ game.phase = 'shown'; save() },
  next(){
    game.played.unshift(game.track);
    if(!game.deck.length){ pause(); game.track = null; game.phase = 'end'; save(); return }
    game.track = game.deck.pop(); game.phase = 'hidden'; save(); render(); if(settings.sound !== 'qr') playCurrent(); return false;
  }
};

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  msg = '';
  const keep = await actions[b.dataset.act]?.(b.dataset, b);
  if(keep !== false) render();
});
app.addEventListener('input', e => { if(e.target.id === 'cid'){ clientId = e.target.value.trim(); LS.set('hx-client', clientId) } });
app.addEventListener('change', e => {
  const s = e.target.dataset.set;
  if(s){ settings[s] = e.target.value; LS.set('hx-settings', settings); render(); return }
  const id = e.target.dataset.yid;
  if(id){
    const v = parseInt(e.target.value, 10), t = library.find(x => x.id === id);
    if(!v || (t && v === t.year)) delete yearFix[id]; else yearFix[id] = v;
    LS.set('hx-years', yearFix);
  }
});

(async () => {
  const fromLogin = await handleCallback();
  if(!fromLogin && game && game.phase !== 'end') screen = 'game';
  render();
})();
</script>
</body>
</html>
